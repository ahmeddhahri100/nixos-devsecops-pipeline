
name: NixOS DevSecOps CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Start with no token permissions.
permissions: {}

jobs:
  nix-quality:
    name: Nix syntax and code quality
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Check Nix syntax
        run: |
          nix-instantiate --parse configuration.nix > /dev/null
          echo "Nix syntax check passed."

      - name: Run Statix
        run: |
          nix shell nixpkgs#statix -c statix check configuration.nix

      - name: Run Deadnix
        run: |
          nix shell nixpkgs#deadnix -c deadnix --fail configuration.nix

      - name: Check Nix formatting
        shell: bash
        run: |
          nix shell nixpkgs#nixfmt -c nixfmt < configuration.nix | diff -u configuration.nix -

      - name: Lint GitHub Actions workflow
        run: |
          nix shell nixpkgs#actionlint -c actionlint .github/workflows/nixos-devsecops.yml

  workflow-security:
    name: Audit GitHub Actions security
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor security audit
        uses: zizmorcore/zizmor-action@f9597c869b2e67095f9b527070297a13a6efe928
        with:
          advanced-security: "false"
          online-audits: true

  secret-scan:
    name: Scan for exposed secrets
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout full Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
